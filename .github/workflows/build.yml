name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION_NAME=$V" >> $GITHUB_ENV
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - building a debug-signed APK only."
          fi

      - name: Build
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p ../dist
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk ../dist/BibliaPolyglotta-$VERSION_NAME.apk
            cp app/build/outputs/bundle/release/app-release.aab ../dist/BibliaPolyglotta-$VERSION_NAME.aab
          else
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/BibliaPolyglotta-$VERSION_NAME-debug.apk
          fi
          ls -l ../dist

      - uses: actions/upload-artifact@v5
        with:
          name: BibliaPolyglotta-${{ env.VERSION_NAME }}
          path: dist/*

      # Tag pushes (v1.2.0 ...) become versioned releases; pushes to main refresh the "latest" pre-release.
      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Release (latest build)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --prerelease --target "$GITHUB_SHA" \
            --title "최신 빌드 $VERSION_NAME" \
            --notes "main 브랜치의 최신 커밋(${GITHUB_SHA::7})으로 자동 빌드된 파일입니다. APK는 휴대폰에 바로 설치, AAB는 플레이 콘솔 업로드용입니다."

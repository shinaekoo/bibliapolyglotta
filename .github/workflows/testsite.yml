name: 시험판 웹페이지

# 설문용 축소판을 GitHub Pages에 올린다 — 창세기 1-3, 여호수아 1-5, 히브리서 전체,
# 요한계시록 1-5 와 라틴어 낱말 음원만 담는다 (tools/trim_site.py).
# 음원은 lexdata 브랜치의 la_audio.tar.gz (lexdata.yml 의 latin 단계가 만든다)에서 가져온다.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 축소판 만들기
        run: python3 tools/trim_site.py site

      - name: 라틴어 음원 끼워 넣기
        uses: actions/checkout@v4
        with:
          ref: lexdata
          path: lex

      - name: 음원 풀기
        run: |
          set -eux
          mkdir -p site/audio
          if [ -f lex/lexdata/la_audio.tar.gz ]; then
            tar xzf lex/lexdata/la_audio.tar.gz -C site/audio
            echo "음원 낱말 $(ls site/audio/la | wc -l)개"
            du -sh site/audio
          else
            echo '::warning::la_audio.tar.gz 가 없다 — 음원 없이 올린다'
            ls -R lex/lexdata || true
          fi
          du -sh site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

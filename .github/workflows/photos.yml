name: Place photos

# OpenBible.info's 512x512 location thumbnails (CC BY 4.0; the pictures themselves are mostly Wikimedia
# Commons under their own open licences, credited in web/data/gph.json and shown in the app).
# They come in one 180 MB zip that the build container cannot reach, so the runner fetches it, keeps the
# files tools/photolist.txt asks for, re-encodes them as webp and commits them to the photos-drop branch.
# Nothing here touches main: run it by hand, then take the branch's web/img/places into a commit of your own.

on:
  workflow_dispatch:
    inputs:
      quality:
        description: 'webp quality'
        default: '78'

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: webp encoder
        run: sudo apt-get -qq update && sudo apt-get -qq install -y webp

      - name: Download the thumbnails
        run: |
          curl -fsSL --retry 3 -o /tmp/thumbs.zip https://a.openbible.info/geo/thumbnails.zip
          ls -l /tmp/thumbs.zip
          mkdir -p /tmp/th && unzip -q -o -j /tmp/thumbs.zip -d /tmp/th
          echo "in the zip: $(ls /tmp/th | wc -l)"

      - name: Keep the ones asked for, as webp
        run: |
          mkdir -p web/img/places
          miss=0; n=0
          while read -r f; do
            [ -z "$f" ] && continue
            if [ -f "/tmp/th/$f" ]; then
              cwebp -quiet -q "${{ inputs.quality }}" -m 6 "/tmp/th/$f" -o "web/img/places/${f%.*}.webp"
              n=$((n+1))
            else
              echo "missing in the zip: $f"; miss=$((miss+1))
            fi
          done < tools/photolist.txt
          echo "written $n, missing $miss"
          du -sh web/img/places
          ls -l web/img/places | awk 'NR>1{s+=$5} END{print "average bytes", int(s/(NR-1))}'
          [ "$miss" -eq 0 ]

      - name: Commit them to photos-drop
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -B photos-drop
          git add -f web/img/places
          git commit -q -m "Place photos: $(ls web/img/places | wc -l) webp from OpenBible.info thumbnails (CC BY 4.0)"
          git push -f origin photos-drop
